<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيلا روزا — فساتين أطفال وملابس بيبي</title>
    <meta name="description" content="بيلا روزا: فساتين أطفال وملابس بيبي إسبانية بذوق مختلف. توصيل لكل مدن المملكة.">
    <meta name="theme-color" content="#FBF7F4">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">

    <!-- الخطوط: Tajawal للنصوص و Amiri للعناوين والعلامة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/store.css">

    <!-- Supabase (UMD) ثم الإعدادات العامة -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <!-- بعد الانتقال إلى Shopify: رابط المتجر في SHOP_REDIRECT (js/config.js) يحوّل كل الروابط القديمة إليه فوراً -->
    <script>(function () { var to = (window.BELLAROSA_CONFIG || {}).SHOP_REDIRECT; if (to) location.replace(to); })();</script>
</head>

<body>
    <!-- شريط الإعلان (يظهر إذا كان في الإعدادات نص) -->
    <div class="announce" id="announce" hidden></div>

    <header class="header">
        <div class="container header-inner">
            <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="القائمة">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>

            <a href="#/" class="brand" id="brand">
                <img src="images/logo.svg" alt="" class="brand-mark" width="36" height="36">
                <span class="brand-name">بيلا روزا</span>
            </a>

            <nav class="nav" id="nav">
                <a href="#/">الرئيسية</a>
                <a href="#/shop">المتجر</a>
                <a href="#/track">تتبع الطلب</a>
                <a href="#/policy">الاستبدال والاسترجاع</a>
            </nav>

            <a href="#/cart" class="icon-btn cart-btn" aria-label="السلة">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 7h12l1 13H5L6 7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10V6a3 3 0 0 1 6 0v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span class="cart-count" id="cartCount" hidden>0</span>
            </a>
        </div>
    </header>

    <main class="container" id="app">
        <div class="loading">جارٍ تحميل المتجر…</div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <div>
                <div class="footer-brand">بيلا روزا</div>
                <p id="footerTagline" class="muted"></p>
            </div>
            <div class="footer-links">
                <a href="#/shop">المتجر</a>
                <a href="#/track">تتبع الطلب</a>
                <a href="#/policy">سياسة الاستبدال والاسترجاع</a>
            </div>
            <div class="footer-contact" id="footerContact"></div>
        </div>
        <div class="container footer-bottom">
            <span id="footerVat" class="muted"></span>
            <span class="muted">الأسعار شاملة ضريبة القيمة المضافة</span>
        </div>
    </footer>

    <!-- زر واتساب عائم (يظهر إذا كان الرقم في الإعدادات) -->
    <a class="wa-float" id="waFloat" hidden target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 1.8.8 2.5.8 3.4.7.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
    </a>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/store.js"></script>
</body>

</html>
